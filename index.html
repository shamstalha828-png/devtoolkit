<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DevToolkit — Free Developer Utilities</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>DevToolkit</h1><p>Simple, private, browser-based developer utilities. No data is uploaded.</p></header><section><h2>JSON Formatter & Validator</h2><textarea id="json" placeholder='{"hello":"world"}' aria-label="JSON input"></textarea><div class="actions"><button id="format">Format JSON</button><button id="minify">Minify JSON</button></div><pre id="jsonResult" aria-live="polite"></pre></section><section><h2>Base64 Encoder / Decoder</h2><textarea id="baseInput" placeholder="Enter text" aria-label="Base64 input"></textarea><div class="actions"><button id="encode">Encode</button><button id="decode">Decode</button></div><pre id="baseResult" aria-live="polite"></pre></section><section><h2>Secure Password Generator</h2><label>Password length <input id="length" type="number" min="8" max="128" value="20"></label><div class="actions"><button id="generate">Generate Password</button></div><pre id="passwordResult" aria-live="polite"></pre></section><section><h2>Text Statistics</h2><textarea id="textInput" placeholder="Type or paste text" aria-label="Text input"></textarea><p id="stats" aria-live="polite">0 characters · 0 words · 0 lines</p></section><footer>Open source under the MIT License. Runs entirely in your browser.</footer></main><script src="script.js"></script></body></html>
